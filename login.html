<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Wooltari Distributor</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0; background: #f5f6f8;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181d; color: #eee; } }
  .card {
    background: white; border-radius: 12px; padding: 40px 48px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08); text-align: center; max-width: 380px;
  }
  @media (prefers-color-scheme: dark) { .card { background: #22252b; box-shadow: 0 2px 16px rgba(0,0,0,0.4); } }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { font-size: 0.9rem; color: #666; margin: 0 0 24px; }
  @media (prefers-color-scheme: dark) { p { color: #aaa; } }
  #g_id_signin { display: flex; justify-content: center; }
  #error-msg {
    color: #c0392b; font-size: 0.85rem; margin-top: 16px; min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Wooltari Distributor</h1>
    <p>Sign in with your @wooltariusa.com Google account to continue.</p>
    <div id="g_id_signin"></div>
    <div id="error-msg"></div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "780301896810-5gff6qf3t8vl2gh9cu6nsmq51tafpf1k.apps.googleusercontent.com";

    function getNextPath() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      return next && next.startsWith("/") ? next : "/";
    }

    async function handleCredentialResponse(response) {
      const errorEl = document.getElementById("error-msg");
      errorEl.textContent = "";
      try {
        const res = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = getNextPath();
        } else {
          errorEl.textContent = data.error || "Sign-in failed.";
        }
      } catch {
        errorEl.textContent = "Could not reach the server. Please try again.";
      }
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        hd: "wooltariusa.com",
      });
      google.accounts.id.renderButton(
        document.getElementById("g_id_signin"),
        { theme: "outline", size: "large", text: "signin_with" }
      );
    };
  </script>
</body>
</html>
